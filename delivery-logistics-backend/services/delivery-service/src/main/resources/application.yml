server:
  port: 8083

spring:
  application:
    name: delivery-service

  datasource:
    url: jdbc:mysql://localhost:3306/delivery_db
    username: admin
    password: adminpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect